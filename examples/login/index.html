<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>style.css — login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dist/style.css" />
    <script src="/examples/scripts/theme-switch.js"></script>
  </head>
  <body>
    <nav class="navbar is-flex is-justify-content-space-between is-align-items-center" aria-label="Main navigation">
      <div class="navbar-brand">
        <a class="navbar-item title mb-0" href="/">Formful</a>
      </div>
      <div class="navbar-item">
        <button id="theme-switch-button" class="button" aria-label="Toggle theme"></button>
      </div>
    </nav>

    <section class="section is-flex is-align-items-center">
      <div class="container is-max-desktop">
        <div class="column is-6 is-offset-3">
          <div class="box pb-4">
            <h1 class="title has-text-centered mb-3">Sign In</h1>
            <form action="../magic-link/" method="get" novalidate>
              <div class="field">
                <label class="label" for="email">Email</label>
                <div class="field has-addons">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="email"
                      id="email"
                      name="email"
                      required
                      autocomplete="email"
                      autofocus
                      placeholder="you@example.com"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="submit">Send Link</button>
                  </div>
                </div>
                <p class="help is-danger has-text-centered is-hidden" id="email-error">Invalid email</p>
              </div>
            </form>
            <div class="is-flex is-align-items-center mt-4">
              <hr class="is-flex-grow-1 my-0" />
              <span class="is-size-8 has-text-muted mx-3">or</span>
              <hr class="is-flex-grow-1 my-0" />
            </div>
            <div class="field mt-4 is-flex is-justify-content-center">
              <div class="control">
                <button class="button" type="button" id="passkey-signin">Use Passkey</button>
              </div>
            </div>
            <p class="help has-text-centered is-hidden" id="passkey-cancel">Cancelled.</p>
            <p class="help is-danger has-text-centered is-hidden" id="passkey-error">
              Couldn't verify. Try again or use email.
            </p>
          </div>
          <p class="has-text-muted is-size-7 has-text-centered mt-4">We won't share your email.</p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 jankrum</p>
      </div>
    </footer>
  </body>
  <script>
    let hasError = false
    const emailInput = document.getElementById('email')
    const emailError = document.getElementById('email-error')

    document.querySelector('form').addEventListener('submit', e => {
      if (emailInput.value.includes('@') || e.preventDefault() || hasError) return
      emailInput.classList.add('is-danger')
      emailError.classList.remove('is-hidden')
      emailInput.focus()
      hasError = true
    })

    emailInput.addEventListener('input', () => {
      if (!hasError) return
      emailInput.classList.remove('is-danger')
      emailError.classList.add('is-hidden')
      hasError = false
    })

    const passkeyBtn = document.getElementById('passkey-signin')
    const passkeyCancel = document.getElementById('passkey-cancel')
    const passkeyError = document.getElementById('passkey-error')

    passkeyBtn.addEventListener('click', e => {
      const isError = e.shiftKey
      const cancelHidden = passkeyCancel.classList.contains('is-hidden')
      const errorHidden = passkeyError.classList.contains('is-hidden')

      passkeyCancel.classList.add('is-hidden')
      passkeyError.classList.add('is-hidden')

      if (isError && errorHidden) {
        passkeyError.classList.remove('is-hidden')
      } else if (!isError && cancelHidden) {
        passkeyCancel.classList.remove('is-hidden')
      }
    })
  </script>
</html>

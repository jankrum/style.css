<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sequencer</title>
    <link rel="stylesheet" href="/examples/vendor/montserrat.css" />
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="/dist/style.css" />
    <link
      href="https://db.onlinewebfonts.com/c/0017dbb0adea91d9e0628450a94687d5?family=LCD+Display+HD44780"
      rel="stylesheet"
    />
    <style>
      .lcd {
        margin: 0;
        border: 0px solid;
        border-radius: var(--bulma-border-radius);
        background-color: var(--bulma-scheme-main);
        padding: 0.5em 1em 0.5em calc((1 / 12 * 1ch) + 1em);
        width: calc(16ch + 2em);
        height: 4em;
        overflow: clip;
        line-height: 1.5;
        font-family: 'LCD Display HD44780', monospace;
        user-select: none;
        text-align: left;
      }

      .section:has(.transporter) {
        padding-right: 0;
        padding-left: 0;
      }

      .transporter {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        background-color: var(--bulma-background);
        padding: 1.5rem;
        width: 100%;

        .buttons {
          display: flex;
          flex-direction: row;
          gap: 0.5rem;
        }

        .button {
          --bulma-duration: 0.1s;

          display: flex;
          justify-content: center;
          align-items: center;
          border-radius: var(--bulma-border-radius);
          padding: 0;
          width: 4em;
          height: 4em;

          svg {
            width: 1.5em;
            height: 1.5em;
          }
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar" aria-label="Main navigation">
      <div class="navbar-brand">
        <a class="navbar-item is-size-5" href="/examples/">Sequencer</a>
      </div>
      <div class="navbar-menu">
        <div class="navbar-start">
          <a class="navbar-item" href="#">Chart Editor</a>
          <a class="navbar-item" href="#">Parts</a>
          <a class="navbar-item" href="#">Settings</a>
        </div>
        <div class="navbar-end">
          <div class="navbar-item">
            <button id="theme-switch-button" class="button" aria-label="Toggle theme"></button>
          </div>
        </div>
      </div>
    </nav>

    <main class="section">
      <div class="transporter">
        <div class="lcd">My Chart</div>
        <div class="buttons">
          <button class="button" aria-label="Previous" disabled>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z" />
              <path d="M3 20V4" />
            </svg>
          </button>
          <button class="button" aria-label="Play">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
            </svg>
          </button>
          <button class="button" aria-label="Pause" disabled>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="14" y="3" width="5" height="18" rx="1" />
              <rect x="5" y="3" width="5" height="18" rx="1" />
            </svg>
          </button>
          <button class="button" aria-label="Stop" disabled>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
            </svg>
          </button>
          <button class="button" aria-label="Next" disabled>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 4v16" />
              <path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" />
            </svg>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 jankrum</p>
      </div>
    </footer>

    <script src="/examples/scripts/theme-switch.js"></script>
    <script src="/examples/vendor/instantclick.min.js" data-no-instant></script>
    <script data-no-instant>
      InstantClick.init()
    </script>
  </body>
</html>

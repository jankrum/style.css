<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>style.css — new survey</title>
    <link rel="stylesheet" href="/examples/vendor/montserrat.css" />
    <link rel="stylesheet" href="/dist/style.css" />
  </head>
  <body>
    <nav
      class="navbar px-2 is-flex is-justify-content-space-between is-align-items-center is-flex-wrap-nowrap"
      aria-label="Main navigation"
    >
      <div class="navbar-brand">
        <a class="navbar-item title mb-0" href="/examples/">Formful</a>
      </div>
      <div class="is-flex is-align-items-center">
        <a class="button" href="/account">Account</a>
        <form action="/sign-out" method="post">
          <button class="button ml-2" type="submit">Sign Out</button>
        </form>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div class="columns">
          <div class="column is-half mx-auto">
            <h1 class="title mb-5">New Survey</h1>
            <div class="box">
              <form action="../edit-survey/" method="get">
                <div class="field">
                  <label class="label" for="name">Name</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="name"
                      name="name"
                      required
                      autofocus
                      placeholder="e.g. Customer Satisfaction Q2"
                    />
                  </div>
                </div>
                <div class="field">
                  <label class="label" for="description">Description</label>
                  <div class="control">
                    <textarea
                      class="textarea"
                      id="description"
                      name="description"
                      placeholder="Optional — describe what this survey is for"
                    ></textarea>
                  </div>
                </div>
                <div class="field is-flex is-justify-content-flex-end is-align-items-center mt-5">
                  <a class="button mr-2" href="../surveys/">Cancel</a>
                  <div class="control">
                    <button class="button is-primary" type="submit">Create Survey</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 jankrum</p>
      </div>
    </footer>
    <script src="/examples/scripts/theme-read.js"></script>
    <script src="/examples/vendor/instantclick.min.js" data-no-instant></script>
    <script data-no-instant>
      InstantClick.init()
    </script>
  </body>
</html>

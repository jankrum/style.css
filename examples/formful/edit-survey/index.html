<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>style.css — edit survey</title>
    <link rel="stylesheet" href="/examples/vendor/montserrat.css" />
    <link rel="stylesheet" href="/dist/style.css" />
  </head>
  <body>
    <nav
      class="navbar px-2 is-flex is-justify-content-space-between is-align-items-center is-flex-wrap-nowrap"
      aria-label="Main navigation"
    >
      <div class="navbar-brand">
        <a class="navbar-item title mb-0" href="/examples/">Formful</a>
      </div>
      <div class="is-flex is-align-items-center">
        <a class="button" href="/account">Account</a>
        <form action="/sign-out" method="post">
          <button class="button ml-2" type="submit">Sign Out</button>
        </form>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div class="columns">
          <div class="column is-two-thirds mx-auto">
            <div class="is-flex is-justify-content-space-between is-align-items-center mb-5">
              <h1 class="title mb-0">Customer Satisfaction Q1</h1>
              <a class="button" href="/surveys/1/settings">Settings</a>
            </div>

            <form action="/surveys/1" method="post">
              <!-- Short text -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[0][type]" aria-label="Question type">
                        <option value="short-text" selected>Short text</option>
                        <option value="long-text">Long text</option>
                        <option value="multiple-choice">Multiple choice</option>
                        <option value="checkboxes">Checkboxes</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="rating">Rating scale</option>
                        <option value="date">Date</option>
                        <option value="time">Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>
                </div>
                <div class="field mb-0">
                  <label class="label" for="q0-prompt">Question</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="q0-prompt"
                      name="questions[0][prompt]"
                      value="What is your full name?"
                    />
                  </div>
                </div>
              </div>

              <!-- Multiple choice -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[1][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text">Long text</option>
                        <option value="multiple-choice" selected>Multiple choice</option>
                        <option value="checkboxes">Checkboxes</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="rating">Rating scale</option>
                        <option value="date">Date</option>
                        <option value="time">Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>
                </div>
                <div class="field">
                  <label class="label" for="q1-prompt">Question</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="q1-prompt"
                      name="questions[1][prompt]"
                      value="How satisfied are you with our service?"
                    />
                  </div>
                </div>
                <label class="label">Options</label>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[1][options][]"
                      value="Excellent"
                      aria-label="Option 1"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[1][options][]"
                      value="Good"
                      aria-label="Option 2"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[1][options][]"
                      value="Fair"
                      aria-label="Option 3"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-3">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[1][options][]"
                      value="Poor"
                      aria-label="Option 4"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <button class="button is-small" type="button">+ Add option</button>
              </div>

              <!-- Checkboxes -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[2][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text">Long text</option>
                        <option value="multiple-choice">Multiple choice</option>
                        <option value="checkboxes" selected>Checkboxes</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="rating">Rating scale</option>
                        <option value="date">Date</option>
                        <option value="time">Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>
                </div>
                <div class="field">
                  <label class="label" for="q2-prompt">Question</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="q2-prompt"
                      name="questions[2][prompt]"
                      value="Which features have you used?"
                    />
                  </div>
                </div>
                <label class="label">Options</label>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[2][options][]"
                      value="Dashboard"
                      aria-label="Option 1"

                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"

                      value="Reports"
                      aria-label="Option 2"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[2][options][]"
                      value="Integrations"
                      aria-label="Option 3"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-3">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"

                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <button class="button is-small" type="button">+ Add option</button>
              </div>

              <!-- Dropdown -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[3][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text">Long text</option>
                        <option value="multiple-choice">Multiple choice</option>
                        <option value="checkboxes">Checkboxes</option>
                        <option value="dropdown" selected>Dropdown</option>
                        <option value="rating">Rating scale</option>
                        <option value="date">Date</option>
                        <option value="time">Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>
                </div>
                <div class="field">
                  <label class="label" for="q3-prompt">Question</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="q3-prompt"
                      name="questions[3][prompt]"
                      value="Which department do you work in?"
                    />
                  </div>
                </div>
                <label class="label">Options</label>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[3][options][]"
                      value="Engineering"
                      aria-label="Option 1"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[3][options][]"
                      value="Marketing"
                      aria-label="Option 2"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[3][options][]"
                      value="Sales"
                      aria-label="Option 3"

                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-2">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[3][options][]"
                      value="Support"
                      aria-label="Option 4"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <div class="field has-addons mb-3">
                  <div class="control is-expanded">
                    <input
                      class="input"
                      type="text"
                      name="questions[3][options][]"
                      value="Other"
                      aria-label="Option 5"
                    />
                  </div>
                  <div class="control">
                    <button class="button" type="button" aria-label="Remove option">&times;</button>
                  </div>
                </div>
                <button class="button is-small" type="button">+ Add option</button>
              </div>

              <!-- Rating scale -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[4][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text">Long text</option>
                        <option value="multiple-choice">Multiple choice</option>
                        <option value="checkboxes">Checkboxes</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="rating" selected>Rating scale</option>
                        <option value="date">Date</option>
                        <option value="time">Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>
                </div>
                <div class="field">
                  <label class="label" for="q4-prompt">Question</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="q4-prompt"
                      name="questions[4][prompt]"
                      value="How likely are you to recommend us to a colleague?"
                    />
                  </div>
                </div>
                <div class="field mb-0">
                  <label class="label" for="q4-scale">Scale</label>
                  <div class="control">
                    <div class="select">
                      <select id="q4-scale" name="questions[4][scale]">
                        <option value="5">1 – 5</option>
                        <option value="10" selected>1 – 10</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Date -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[5][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text">Long text</option>
                        <option value="multiple-choice">Multiple choice</option>
                        <option value="checkboxes">Checkboxes</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="rating">Rating scale</option>
                        <option value="date" selected>Date</option>
                        <option value="time">Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>
                </div>
                <div class="field mb-0">
                  <label class="label" for="q5-prompt">Question</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="q5-prompt"
                      name="questions[5][prompt]"
                      value="When did you last contact our support team?"
                    />

                </div>

                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">

                    <div class="select">
                      <select name="questions[6][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text">Long text</option>

                        <option value="date">Date</option>
                        <option value="time" selected>Time</option>
                      </select>
                    </div>
                  </div>
                  <button class="button" type="button" aria-label="Remove question">Remove</button>

                    <input
                      class="input"
                      type="text"
                      id="q6-prompt"
                      name="questions[6][prompt]"
                      value="What time does your shift start?"
                    />
                  </div>
                </div>
              </div>

              <!-- Long text -->
              <div class="box mb-4">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-4">
                  <div class="is-flex is-align-items-center">
                    <div class="buttons has-addons mb-0 mr-3">
                      <button class="button" type="button" aria-label="Move up">↑&#xFE0E;</button>
                      <button class="button" type="button" aria-label="Move down">↓&#xFE0E;</button>
                    </div>
                    <div class="select">
                      <select name="questions[7][type]" aria-label="Question type">
                        <option value="short-text">Short text</option>
                        <option value="long-text" selected>Long text</option>
                        <option value="multiple-choice">Multiple choice</option>
                        <option value="checkboxes">Checkboxes</option>
                        <option value="dropdown">Dropdown</option>
                        <option value="rating">Rating scale</option>

                    <input
                      class="input"
                      type="text"

                      name="questions[7][prompt]"
                      value="Any additional comments or suggestions?"
                    />
                  </div>

              </div>

              <div class="mb-4">
                <button class="button is-fullwidth" type="button">+ Add Question</button>
              </div>

              <div class="is-flex is-justify-content-flex-end is-align-items-center">
